<svg width="500" height="120" viewBox="0 0 500 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Main Circle Background -->
  <circle cx="60" cy="60" r="58" fill="#5C0A0A"/>
  <circle cx="60" cy="60" r="56" fill="none" stroke="#D4AF37" stroke-width="3"/>
  
  <!-- Elephant Head - Detailed -->
  <g transform="translate(60, 60)">
    <!-- Left Ear -->
    <ellipse cx="-28" cy="0" rx="15" ry="25" fill="#8B6914" opacity="0.9"/>
    <ellipse cx="-28" cy="0" rx="12" ry="22" fill="#6B5410"/>
    
    <!-- Right Ear -->
    <ellipse cx="28" cy="0" rx="15" ry="25" fill="#8B6914" opacity="0.9"/>
    <ellipse cx="28" cy="0" rx="12" ry="22" fill="#6B5410"/>
    
    <!-- Head -->
    <ellipse cx="0" cy="0" rx="22" ry="28" fill="#8B6914"/>
    
    <!-- Forehead marking -->
    <rect x="-3" y="-18" width="6" height="8" fill="#FFF" rx="1"/>
    <rect x="-2" y="-16" width="4" height="4" fill="#8B0000"/>
    
    <!-- Left Tusk -->
    <path d="M -15,-8 Q -18,-15 -20,-22 L -18,-20 Q -16,-12 -14,-8 Z" fill="#F5DEB3"/>
    <path d="M -15,-8 Q -17,-14 -19,-20" stroke="#D4AF37" stroke-width="1" fill="none"/>
    
    <!-- Right Tusk -->
    <path d="M 15,-8 Q 18,-15 20,-22 L 18,-20 Q 16,-12 14,-8 Z" fill="#F5DEB3"/>
    <path d="M 15,-8 Q 17,-14 19,-20" stroke="#D4AF37" stroke-width="1" fill="none"/>
    
    <!-- Trunk -->
    <path d="M 0,-12 Q -2,-18 -4,-24 Q -5,-28 -4,-32 Q -3,-28 -2,-24 Q 0,-18 0,-12 Z" fill="#8B6914"/>
    <path d="M 0,-12 Q -2,-20 -4,-28" stroke="#6B5410" stroke-width="1" fill="none"/>
    
    <!-- Eyes -->
    <circle cx="-8" cy="-5" r="3" fill="#FFF"/>
    <circle cx="-8" cy="-5" r="2" fill="#000"/>
    <circle cx="8" cy="-5" r="3" fill="#FFF"/>
    <circle cx="8" cy="-5" r="2" fill="#000"/>
    
    <!-- Decorative elements on ears -->
    <path d="M -28,-10 Q -30,-5 -28,0 Q -26,-5 -28,-10" fill="#D4AF37" opacity="0.5"/>
    <path d="M 28,-10 Q 30,-5 28,0 Q 26,-5 28,-10" fill="#D4AF37" opacity="0.5"/>
  </g>
  
  <!-- Red Banner Background -->
  <rect x="140" y="25" width="340" height="50" rx="25" fill="#8B0000"/>
  
  <!-- Text: THIRU ANNAMALAI -->
  <text x="160" y="52" font-family="serif" font-size="28" font-weight="bold" fill="#D4AF37" letter-spacing="2">
    THIRU ANNAMALAI
  </text>
  
  <!-- Text: Natural Foods -->
  <text x="280" y="68" font-family="serif" font-size="18" fill="#D4AF37" letter-spacing="1">
    Natural Foods
  </text>
  
  <!-- Ribbon Banner for Tagline -->
  <path d="M 20,95 L 180,95 L 185,100 L 180,105 L 20,105 L 15,100 Z" fill="#8B0000"/>
  <path d="M 20,95 L 180,95 L 185,100 L 180,105 L 20,105 L 15,100 Z" fill="none" stroke="#6B0000" stroke-width="1"/>
  
  <!-- Tagline Text -->
  <text x="35" y="103" font-family="serif" font-size="11" fill="#D4AF37" font-style="italic">
    Healthy in Every Piece of Bite
  </text>
</svg>
